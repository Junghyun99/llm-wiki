name: Wiki CI

on:
  push:
    branches: [main]
    paths:
      - "03_Wiki/**"
  pull_request:
    branches: [main]
    paths:
      - "03_Wiki/**"

jobs:
  # ──────────────────────────────────────────────
  # Job 1: index.md 통계 정합성 검사
  # ──────────────────────────────────────────────
  check-index-stats:
    name: "📊 index.md 통계 정합성"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run stats check
        run: python3 .github/scripts/check_index_stats.py

  # ──────────────────────────────────────────────
  # Job 2: index.md 동기화 검사
  # ──────────────────────────────────────────────
  check-index-sync:
    name: "🗂️ index.md 동기화"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run index sync check
        run: python3 .github/scripts/check_index_sync.py

  # ──────────────────────────────────────────────
  # Job 3: 데드 링크 전수 검사
  # ──────────────────────────────────────────────
  check-dead-links:
    name: "🔗 데드 링크 검사"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run dead link check
        run: python3 .github/scripts/check_dead_links.py
